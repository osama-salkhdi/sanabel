<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ s.name }}</title><link rel="icon" href="assets/img/fav.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Rakkas&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css"></head><body>
{% set nav=[('index','الرئيسية'),('students','طلابنا'),('projects','مشاريعنا'),('platform','منصة التدريب'),('achievements','إنجازاتنا'),('about','من نحن')] %}
<header class="top"><a class="brand" href="index.html"><img src="assets/img/mark.png" alt=""><b id="bn">{{ s.name }}</b></a>
<button class="burger" aria-label="القائمة" onclick="document.body.classList.toggle('open')">☰</button>
<nav>{% for k,t in nav %}<a href="{{k}}.html" {% if k==page %}class="on"{% endif %}>{{t}}</a>{% endfor %}</nav></header>
<main id="app" data-page="{{page}}"></main><footer id="ft"><b>{{ s.name }}</b> — {{ s.tagline }}</footer><script src="assets/js/site.js"></script></body></html>
